<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>Проверка файлов</title>
</head>

<body>

    <h1>Поиск конфиденциальных данных</h1>

    <form
        action="/scan"
        method="post"
        enctype="multipart/form-data"
    >

        <input
            type="file"
            name="file"
            accept=".txt"
        >

        <button type="submit">
            Проверить файл
        </button>

    </form>

</body>
</html>
