<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>{% block title %}Анализатор документов{% endblock %}</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f6fa;
        }

        .topbar {
            background: #1f2937;
            color: white;
            padding: 15px 30px;
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .logo {
            font-size: 20px;
            font-weight: bold;
        }

        .menu {
            position: relative;
        }

        .menu-button {
            background: #374151;
            color: white;
            border: none;
            padding: 10px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 18px;
        }

        .dropdown {
            display: none;
            position: absolute;
            top: 45px;
            left: 0;
            background: white;
            color: #111827;
            min-width: 240px;
            border-radius: 10px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            overflow: hidden;
            z-index: 10;
        }

        .menu:hover .dropdown {
            display: block;
        }

        .dropdown-section {
            padding: 12px 16px 6px;
            font-weight: bold;
            color: #6b7280;
            font-size: 13px;
            text-transform: uppercase;
        }

        .dropdown a {
            display: block;
            padding: 12px 16px;
            color: #111827;
            text-decoration: none;
        }

        .dropdown a:hover {
            background: #f3f4f6;
        }

        .content {
            max-width: 900px;
            margin: 40px auto;
            background: white;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 4px 14px rgba(0,0,0,0.08);
        }

        button {
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="topbar">

        <div class="menu">
            <button class="menu-button">☰</button>

            <div class="dropdown">

                <div class="dropdown-section">Анализ</div>
                <a href="/">Проверить документ</a>
                <a href="/history">История проверок</a>

                <div class="dropdown-section">Объекты защиты</div>
                <a href="/protected">Защищаемые документы</a>
                <a href="/regular">Обычные документы</a>

            </div>
        </div>

        <div class="logo">
            Анализатор документов
        </div>

    </div>

    <main class="content">
        {% block content %}{% endblock %}
    </main>

</body>
</html>
